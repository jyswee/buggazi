startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: Buggazi API key (bgz_...). Optional; without one the server starts in onboarding mode and can self-signup via the buggazi_signup tool.
  commandFunction: |-
    (config) => ({ command: "bgz", args: ["mcp-serve"], env: config.apiKey ? { BGZ_API_KEY: config.apiKey } : {} })
